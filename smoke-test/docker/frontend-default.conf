# FIX: upstream hard-codes `X-Forwarded-Proto https`, so on a plain-http install Django builds https:// URLs
# and every admin-panel action (Make Topup, Confirm email, ...) POSTs to a dead https://localhost URL.
# Forward the real scheme, or keep the one set by an outer TLS proxy (Caddy) if present.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Smoke-test copy of the installer's frontend/default.conf (OpenCEX/frontend/default.conf).
# Differences vs the installer template:
#  - DOMAIN and ADMIN_BASE_URL are already substituted (localhost / admin), as opencex.sh does with sed.
#  - Upstreams are resolved at request time through Docker's embedded DNS (resolver 127.0.0.11 +
#    "set $upstream_x ...; proxy_pass $upstream_x;"), so nginx starts (and `nginx -t` passes) even when
#    opencex / opencex-wss / nuxt / admin are not running. A missing upstream gives 502 on its paths only.
#    proxy_pass has no URI part, so the full original request URI is passed exactly as before.
map $remote_addr        $cond {
   "default"                  "0";
   "0.0.0.0"        "1";
    }

server {
set_real_ip_from 172.0.0.1/8;
#real_ip_header CF-Connecting-IP;
real_ip_header X-Forwarded-For;
add_header Content-Security-Policy "frame-ancestors *";
add_header X-Frame-Options "ALLOW-FROM opencex";

    # Docker embedded DNS; re-resolve container names every 10s (smoke-test patch)
    resolver 127.0.0.11 valid=10s;

    proxy_connect_timeout       600;
    proxy_send_timeout          600;
    proxy_read_timeout          600;
    send_timeout                600;

    fastcgi_connect_timeout 600s;
    fastcgi_send_timeout 600s;
    fastcgi_read_timeout 600s;


#set $maintenance on;
#set $cond "${cond}0";


location =  /account/wizard  {
return 404;
}
location =  /account/wizard/  {
return 404;
}




if ($cond = 00) {
return 403;
}
error_page 503 @maintenance;
error_page 403 @maintenance;

    listen     80 default_server;

    server_name   localhost;
    root /usr/share/nginx/html;



# SECURITY FIX: upstream used `location /media` (no trailing slash) + `alias /app/media/`, so
# /media../.env served /app/.env (backend secrets) once /app/media exists (nginx off-by-slash traversal).
location /media/ {
       alias /app/media/ ;
}


location   /account {
        root     /usr/share/nginx/html;
        index    index.html index.htm;
    try_files $uri $uri/ /index.html =404;
    }

location   /public  {
        root     /usr/share/nginx/html;
        index    index.html index.htm;
                try_files $uri $uri/ =404;
    }

location   /assets  {
        root     /usr/share/nginx/html;
        index    index.html index.htm;
    try_files $uri $uri/ /index.html =404;

    }



    location /wsapi {
            set $upstream_wss http://opencex-wss:8000;
            proxy_pass $upstream_wss;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
    }


location   /admin {

            set $upstream_admin http://admin:80;
            proxy_pass $upstream_admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;

}


  location / {

            set $upstream_nuxt http://nuxt:3000;
            proxy_pass $upstream_nuxt;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header   X-Forwarded-Host $server_name;

}


location /upload/ { alias /app/media/; }  # same off-by-slash fix

location /robots.txt { alias /usr/share/nginx/html/static/robots.txt; }

    location /staticfiles/ {
        root /app/;
        try_files $uri =404;
    }


  location /apiadmin {
            set $upstream_backend http://opencex:8080;
            proxy_pass $upstream_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
}

  location /api {
            set $upstream_backend http://opencex:8080;
            proxy_pass $upstream_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
}






    location @proxy {


            set $upstream_backend http://opencex:8080;
            proxy_pass $upstream_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;






if (-f $document_root/maintenance) {
set $cond "${cond}0";
}



    }
        location @maintenance {
            root /usr/share/nginx/html/public;
            rewrite ^(.*)$ /dump.html break;
        }



}
